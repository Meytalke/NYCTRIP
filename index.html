<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New York Trip 2026 🇺🇸</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --accent-primary: #ec4899; 
            --accent-harry: #10b981;    
            --accent-flight: #3b82f6;   
            --accent-mustsee: #06b6d4;  
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; font-family: 'Assistant', sans-serif; }
        html[dir="ltr"] body { font-family: 'Poppins', sans-serif; }
        .container { max-width: 650px; margin: 0 auto; }

        .user-bar { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .user-bar select { padding: 6px 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 0.9rem; }

        .lang-toggle-btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; display: block; margin: 0 auto 10px auto; }
        header { text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, #1e1b4b, #2e1065); padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #4c1d95; }
        header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 5px; background: linear-gradient(to left, #f472b6, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; }
        .countdown-container { display: flex; justify-content: center; gap: 10px; }
        .countdown-box { background: rgba(255, 255, 255, 0.06); padding: 8px 0; border-radius: 12px; width: 75px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .countdown-box span { display: block; font-size: 1.5rem; font-weight: 700; color: #fff; }
        .countdown-box label { font-size: 0.75rem; color: var(--text-muted); }

        .info-scroll-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .info-card { flex: 0 0 85%; background: var(--card-bg); padding: 16px; border-radius: 14px; border-top: 4px solid var(--accent-flight); }
        .info-card h3 { font-size: 0.95rem; margin-bottom: 6px; color: var(--text-muted); }
        .info-card p { font-weight: 600; font-size: 1rem; color: #fff; }

        .day-row { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
        .day-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; padding-bottom: 8px; margin-bottom: 12px; }
        .day-title { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
        .day-date { color: var(--text-muted); font-size: 0.85rem; }

        .event-list { display: flex; flex-direction: column; gap: 10px; }
        .event-item { display: flex; align-items: center; padding: 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.5); position: relative; }
        
        html[dir="rtl"] .event-item { border-right: 4px solid #64748b; }
        html[dir="ltr"] .event-item { border-left: 4px solid #64748b; }
        html[dir="rtl"] .event-item.flight { border-right-color: var(--accent-flight); }
        html[dir="ltr"] .event-item.flight { border-left-color: var(--accent-flight); }
        html[dir="rtl"] .event-item.harry { border-right-color: var(--accent-harry); }
        html[dir="ltr"] .event-item.harry { border-left-color: var(--accent-harry); }
        html[dir="rtl"] .event-item.mustsee { border-right-color: var(--accent-mustsee); }
        html[dir="ltr"] .event-item.mustsee { border-left-color: var(--accent-mustsee); }
        html[dir="rtl"] .event-item.custom { border-right-color: #a855f7; }
        html[dir="ltr"] .event-item.custom { border-left-color: #a855f7; }

        .event-icon { font-size: 1.2rem; width: 24px; text-align: center; }
        html[dir="rtl"] .event-icon { margin-left: 12px; }
        html[dir="ltr"] .event-icon { margin-right: 12px; }

        .event-item.flight .event-icon { color: var(--accent-flight); }
        .event-item.harry .event-icon { color: var(--accent-harry); }
        .event-item.mustsee .event-icon { color: var(--accent-mustsee); }
        .event-item.custom .event-icon { color: #a855f7; }

        .event-details { flex-grow: 1; }
        .event-time { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: block; }
        .event-name { font-weight: 600; font-size: 0.95rem; display: block; }
        .created-by-badge { font-size: 0.7rem; color: var(--accent-mustsee); display: block; margin-top: 2px; }

        .delete-btn { background: transparent; border: none; color: #ef4444; padding: 8px; cursor: pointer; }
        .add-event-section { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-top: 25px; border: 1px solid #334155; }
        .add-event-section h2 { margin-bottom: 12px; font-size: 1.2rem; color: #f472b6; }
        .form-grid { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; width: 100%; }
        button.btn-submit { background: linear-gradient(to left, #ec4899, #8b5cf6); border: none; font-weight: 700; cursor: pointer; }

        @media (min-width: 600px) {
            .info-scroll-container { overflow-x: visible; display: grid; grid-template-columns: repeat(3, 1fr); }
            .info-card { flex: none; }
        }
    </style>
</head>
<body>

</div>

    function saveCurrentUser() {
        currentUser = document.getElementById('user-select').value;
        localStorage.setItem('nyc_trip_user', currentUser);
        fetchEvents();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'he' ? 'en' : 'he';
        const root = document.getElementById('html-root');
        root.setAttribute('dir', currentLang === 'en' ? 'ltr' : 'rtl');
        updateUIStrings();
        fetchEvents();
        populateDateDropdown();
    }

    function updateUIStrings() {
        const t = translations[currentLang];
        document.getElementById('lang-btn').innerText = t.btn;
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('ui-subtitle').innerText = t.subtitle;
        document.getElementById('lbl-days').innerText = t.days;
        document.getElementById('lbl-hours').innerText = t.hours;
        document.getElementById('lbl-min').innerText = t.min;
        document.getElementById('ui-form-title').innerText = t.formTitle;
        document.getElementById('ui-form-btn').innerText = t.formBtn;
    }

    function populateDateDropdown() {
        const dropdown = document.getElementById('form-date');
        dropdown.innerHTML = '';
        tripDays.forEach(day => {
            const option = document.createElement('option');
            option.value = day.date;
            option.innerText = day[currentLang].desc;
            dropdown.appendChild(option);
        });
    }

    async function fetchEvents() {
        renderTimeline(defaultStaticEvents);
        try {
            const res = await fetch(API_URL);
            const serverEvents = await res.json();
            const dynamicEvents = serverEvents.filter(e => !e.isStatic);
            const combinedEvents = [...defaultStaticEvents, ...dynamicEvents];
            renderTimeline(combinedEvents);
        } catch (err) {
            console.error("Error fetching data from server, showing default schedule:", err);
        }
    }

    function renderTimeline(allEvents) {
        const container = document.getElementById('timeline-container');
        container.innerHTML = '';
        const t = translations[currentLang];

        tripDays.forEach(day => {
            const dayEvents = allEvents.filter(e => e.date === day.date);
            dayEvents.sort((a,b) => a.time.localeCompare(b.time));

            let dayHtml = `
                <div class="day-row">
                    <div class="day-header">
                        <span class="day-title">${day[currentLang].desc}</span>
                        <span class="day-date">${day[currentLang].label}</span>
                    </div>
                    <div class="event-list">
            `;

            if (dayEvents.length === 0) {
                dayHtml += `<p style="color: var(--text-muted); font-size:0.85rem;">${t.emptyDay}</p>`;
            } else {
                dayEvents.forEach(ev => {
                    let icon = 'fa-star';
                    if (ev.type === 'flight') icon = 'fa-plane';
                    if (ev.type === 'harry') icon = 'fa-microphone';
                    if (ev.type === 'mustsee') icon = 'fa-map-location-dot';
                    if (ev.type === 'custom') icon = 'fa-masks-theater';
                    if (ev.type === 'transit') icon = 'fa-taxi';

                    const displayTime = ev.time || t.flexible;
                    const displayName = currentLang === 'he' ? ev.nameHe : ev.nameEn;
                    const showDelete = !ev.isStatic;

                    dayHtml += `
                        <div class="event-item ${ev.type}">
                            <div class="event-icon"><i class="fa-solid ${icon}"></i></div>
                            <div class="event-details">
                                <span class="event-time">${displayTime}</span>
                                <span class="event-name">${displayName}</span>
                                ${!ev.isStatic ? `<span class="created-by-badge">${t.addedBy}${ev.createdBy}</span>` : ''}
                            </div>
                            ${showDelete ? `<button class="delete-btn" onclick="deleteEvent('${ev._id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    `;
                });
            }

            dayHtml += `</div></div>`;
            container.innerHTML += dayHtml;
        });
    }

    async function addCustomEvent() {
        const date = document.getElementById('form-date').value;
        const nameHe = document.getElementById('form-name-he').value;
        const nameEn = document.getElementById('form-name-en').value;
        const time = document.getElementById('form-time').value;

        if (!nameHe || !nameEn) return alert('חובה למלא שם בשתי השפות');

        const newEvent = {
            date, nameHe, nameEn,
            time: time || "גמיש",
            type: "custom",
            createdBy: currentUser
        };

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newEvent)
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error);

            document.getElementById('form-name-he').value = '';
            document.getElementById('form-name-en').value = '';
            document.getElementById('form-time').value = '';
            fetchEvents();
        } catch (err) {
            console.error("Error creating event:", err);
        }
    }

    async function deleteEvent(id) {
        if (!confirm('האם אתה בטוח שברצונך למחוק אירוע זה מלוח הזמנים של כולם?')) return;
        
        try {
            const res = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json();
            if (!res.ok) alert(data.error);
            fetchEvents();
        } catch (err) {
            console.error("Error deleting event:", err);
        }
    }

    const flightDate = new Date("September 25, 2026 11:00:00").getTime();
    function updateCountdown() {
        const now = new Date().getTime();
        const diff = flightDate - now;
        if (diff < 0) return;
        document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    }

    updateUIStrings();
    populateDateDropdown();
    fetchEvents();
    updateCountdown();
    setInterval(updateCountdown, 60000);
</script>

</body>
</html>
